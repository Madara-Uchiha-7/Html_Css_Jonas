<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Introduction to CSS</title>
  </head>
  <body>
    <!-- //- CSS stands for cascading style sheets. -->
    <!-- //. -->
    <!-- //- CSS is also one of the core technologies of the web. -->
    <!-- //. -->
    <!-- //- We use CSS to describe the visual style and the presentation of the content that we previously wrote using HTML. -->
    <!-- //. -->
    <!-- //- CSS consists of countless properties that we developers can then use to format the content. -->
    <!-- //. -->
    <!-- //- You don't need to know all of them by heart, you use the most important ones over and over again -->
    <!-- //- and at one point it will then become very intuitive. -->
    <!-- //. -->
    <!-- //* Example -->
    <!-- 
      h1 {
        color : blue;
        text-align : center;
        font-size : 20px;
      }
    -->
    <!-- 
    - It always starts with the selector. Here it is h1.
    - This will style all the h1 elements which we have added in our HTML code.
    - Here the styles or declaration are color : blue, text-align : center and font-size : 20px.
    - The color, text-align and font-size are called as properties and right side of : is called as the values.
    - So, property and value together is called declaration or style.
    - Whatever goes inside the {} is declaration block. All this together is called CSS rule.
    -->
    <!-- //. -->
  </body>
</html>
