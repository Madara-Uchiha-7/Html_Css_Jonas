<!DOCTYPE html>
<!-- We use ! + enter to create the basic HTML code -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- title element will add the content to tab of browser. -->
    <title>5. Your Very First Webpage!</title>
  </head>
  <body>
    <!-- h + number is used to as the heading tag. This allows user 
     to add the big text on the web page. -->
    <h1>Hello Word</h1>
    <!-- p is a paragraph tag. This is used to add the text as the paragraph.  -->
    <!-- Below whole thing is called the paragram element, including its content. -->
    <p>This is my first page.</p>
  </body>
</html>
