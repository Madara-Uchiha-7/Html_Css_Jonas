<!DOCTYPE html>
<!-- Above tag tells the browser that this document uses HTML.
 It also tells the browser to use HTML5 specification to render the HTML. -->
<!-- Every HTML element need to start with with <html> -->
<html lang="en">
  <!-- We will have one head element and one body element. -->
  <head>
    <!-- Head element will have the things which are not visible on
     the browser window/ HTML page. It will contain page title,
     some additional information about the browser, link to CSS file
     and other things. -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>10. HTML Document Structure</title>
  </head>
  <body>
    <!-- All the elements which will be visible on the browser page 
     will be inside this body tag. -->
    <!-- h1 is heading one element -->
    <h1>The basic language of the web: HTML</h1>
  </body>
</html>
